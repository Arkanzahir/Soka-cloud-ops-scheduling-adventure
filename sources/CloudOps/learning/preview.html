<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Cloud Ops — M6 Learning UI Preview</title>
  <link rel="stylesheet" href="./learning-panel.css">
  <style>
    * {box-sizing:border-box;} body {margin:0;min-height:100vh;font-family:Nunito,'Trebuchet MS',sans-serif;background:linear-gradient(165deg,#e3bd82 0%,#c0cf86 50%,#e3d5a6 100%);color:#382c38;}
    .preview-landscape {position:fixed;inset:0;padding:10vh 5vw;overflow:hidden;pointer-events:none;}
    .preview-landscape .label {font-size:clamp(27px,5vw,66px);font-weight:900;max-width:50vw;line-height:1.1;}
    .preview-landscape p {max-width:37vw;font-size:17px;font-weight:700;}
    .preview-landscape .landmark {position:absolute;left:10vw;bottom:12vh;width:26vw;height:17vh;border-radius:22px;background:#bb8760;box-shadow:32px -16px 0 #e5b27c,45px -16px 0 #674d42;transform:skewX(-16deg);}
    .preview-landscape .watermark {position:absolute;bottom:16px;left:18px;font-size:13px;font-weight:900;letter-spacing:.13em;opacity:.72;}
    .preview-open {position:fixed;top:28px;right:27px;background:#6e4d45;color:white;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;z-index:3;}
    @media(max-width:650px){.preview-landscape .label,.preview-landscape p{max-width:94vw;}.preview-landscape{padding:5vh 5vw;}}
  </style>
</head>
<body>
  <main class="preview-landscape" aria-label="Placeholder latar preview, bukan world 3D">
    <div class="label">CLOUD OPS<br>Scheduling Adventure</div>
    <p>Pratinjau UI M6 menggunakan kode algoritma asli. Latar ini hanya placeholder; bukan render world Bruno.</p>
    <div class="landmark" aria-hidden="true"></div>
    <div class="watermark">M6 UI-ONLY PREVIEW · THREE.JS WORLDS BELUM TERINTEGRASI</div>
  </main>
  <button class="preview-open" type="button">Buka Panel Materi</button>
  <script type="module">
    import { LearningPanel } from './LearningPanel.js'
    const panel = new LearningPanel({ mount: document.body })
    document.querySelector('.preview-open').addEventListener('click', () => panel.open())
    panel.open(0)
    window.cloudOpsPreview = panel
  </script>
</body>
</html>
