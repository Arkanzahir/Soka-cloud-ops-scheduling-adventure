name: Verified Pages release
on:
  workflow_dispatch:
    inputs:
      rights_verified:
        description: 'Asset redistribution evidence reviewed and all deployment blockers cleared'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.rights_verified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base /Soka-cloud-ops-scheduling-adventure/
        env:
          VITE_GAME_PUBLIC: ''
          VITE_SERVER_URL: ''
      - run: npm run test:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
